[project]
name = "langgraph-tutorials"
version = "0.1.0"
description = "LangGraph Tutorials from LangChain Academy"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "e-hossam96", email = "ehh.hossam@gmail.com" }]
dependencies = [
  "grandalf>=0.8",
  "langchain>=1.3.15",
  "langchain-openai>=1.5.1",
  "langfuse>=4.15.1",
  "langgraph>=1.2.11",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "openai>=3.1.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "rich>=15.0.0",
  "sqlalchemy>=2.0.52",
  "tavily-python>=0.7.27",
  "tqdm>=4.70.0",
]

[project.scripts]
langgraph-tutorials = "langgraph_tutorials:main"

[dependency-groups]
dev = [
  "ruff>=0.16.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"
lint = { select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"] }
format = { quote-style = "double", indent-style = "space", line-ending = "auto" }
